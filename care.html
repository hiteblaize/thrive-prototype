<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Carda Health — Your Care</title>
<style>
@font-face {
  font-family: "Circular Std";
  src: url("design-system/fonts/CircularStd-Book.otf") format("opentype");
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Circular Std";
  src: url("design-system/fonts/CircularStd-Medium.otf") format("opentype");
  font-weight: 500; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Circular Std";
  src: url("design-system/fonts/CircularStd-Bold.otf") format("opentype");
  font-weight: 700; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Circular Std";
  src: url("design-system/fonts/CircularStd-Black.otf") format("opentype");
  font-weight: 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "ABC Marist";
  src: url("design-system/fonts/ABCMarist-SemiBold.otf") format("opentype");
  font-weight: 600; font-style: normal; font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --c-dark-green:   #142E0F;
  --c-lime:         #D8E73C;
  --c-citrus:       #FB6E28;
  --c-plum:         #C7B9FF;
  --c-sky:          #97DDF7;
  --c-natural:      #F4F0EB;
  --c-dg-08:        rgba(20,46,15,0.08);
  --c-dg-16:        rgba(20,46,15,0.16);
  --c-dg-30:        rgba(20,46,15,0.30);
  --c-dg-60:        rgba(20,46,15,0.60);
  --c-white:        #FFFFFF;
  --font-display:   "ABC Marist", Georgia, serif;
  --font-sans:      "Circular Std", -apple-system, BlinkMacSystemFont, sans-serif;
  --sh-card:        0 4px 8px rgba(0,0,0,0.12);
  --sh-soft:        0 2px 6px rgba(0,0,0,0.07);
  --ease-out:       cubic-bezier(0.2, 0.8, 0.2, 1);
}

html, body {
  background: #f0ede8;
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  padding: 24px 0 48px;
}

.phone {
  width: 390px;
  min-height: 844px;
  background: var(--c-natural);
  border-radius: 48px;
  overflow: hidden;
  box-shadow: 0 32px 80px rgba(0,0,0,0.28), 0 0 0 1px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  position: relative;
}

.status-bar {
  background: var(--c-dark-green);
  height: 54px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 28px 8px;
  flex-shrink: 0;
}
.status-time { font-family: var(--font-sans); font-weight: 700; font-size: 15px; color: var(--c-white); letter-spacing: -0.01em; }
.status-icons { display: flex; align-items: center; gap: 6px; }

.app-header {
  background: var(--c-dark-green);
  padding: 18px 24px 22px;
}
.header-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.header-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 26px;
  letter-spacing: -0.01em;
  color: var(--c-white);
  line-height: 1.1;
}
.header-sub {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 13px;
  color: rgba(255,255,255,0.50);
  margin-top: 3px;
}
.active-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(216,231,60,0.15);
  border: 1px solid rgba(216,231,60,0.30);
  border-radius: 9999px;
  padding: 5px 12px 5px 8px;
  flex-shrink: 0;
  margin-top: 2px;
}
.active-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c-lime); flex-shrink: 0; }
.active-badge-text { font-family: var(--font-sans); font-weight: 700; font-size: 11px; letter-spacing: 0.04em; color: var(--c-lime); text-transform: uppercase; }

.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 96px;
}
.scroll-area::-webkit-scrollbar { display: none; }

.content {
  padding: 20px 16px 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.section-label {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--c-dg-60);
  padding: 0 4px;
  margin-bottom: -4px;
}

/* ── Medication card ── */
.med-card {
  background: var(--c-dark-green);
  border-radius: 28px;
  overflow: hidden;
  box-shadow: var(--sh-card);
}
.med-card-header {
  padding: 18px 20px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.med-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  color: var(--c-white);
  margin-bottom: 3px;
  line-height: 1.1;
}
.med-brand {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 13px;
  color: rgba(255,255,255,0.45);
}
.med-dose-badge {
  background: rgba(216,231,60,0.15);
  border: 1px solid rgba(216,231,60,0.30);
  border-radius: 12px;
  padding: 6px 12px;
  text-align: right;
  flex-shrink: 0;
}
.med-dose-value {
  font-family: var(--font-sans);
  font-weight: 900;
  font-size: 20px;
  letter-spacing: -0.02em;
  color: var(--c-lime);
  line-height: 1;
}
.med-dose-unit {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 11px;
  color: rgba(216,231,60,0.60);
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.med-card-body {
  padding: 16px 20px 18px;
}
.med-stats {
  display: flex;
  gap: 0;
  margin-bottom: 18px;
}
.med-stat {
  flex: 1;
  padding-right: 16px;
  border-right: 1px solid rgba(255,255,255,0.08);
  margin-right: 16px;
}
.med-stat:last-child { border-right: none; margin-right: 0; padding-right: 0; }
.med-stat-label {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 11px;
  color: rgba(255,255,255,0.40);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.med-stat-value {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 14px;
  color: var(--c-white);
  line-height: 1.2;
}
.med-stat-value.upcoming { color: var(--c-sky); }

/* Dose escalation ladder */
.dose-ladder {
  display: flex;
  align-items: center;
  gap: 0;
  position: relative;
}
.dose-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  flex: 1;
  position: relative;
}
.dose-step-node {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 10px;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
}
.dose-step-node.done {
  background: rgba(216,231,60,0.20);
  border: 1.5px solid rgba(216,231,60,0.40);
  color: var(--c-lime);
}
.dose-step-node.current {
  background: var(--c-lime);
  color: var(--c-dark-green);
  box-shadow: 0 0 0 4px rgba(216,231,60,0.20);
}
.dose-step-node.upcoming {
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.25);
}
.dose-step-node svg { width: 12px; height: 12px; }
.dose-step-label {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  text-align: center;
  line-height: 1.2;
}
.dose-step.current-step .dose-step-label { color: var(--c-lime); }
.dose-step.done-step .dose-step-label { color: rgba(255,255,255,0.45); }

/* Connector lines between nodes */
.dose-connector {
  flex: 1;
  height: 2px;
  margin-bottom: 22px;
  position: relative;
}
.dose-connector-track {
  height: 100%;
  background: rgba(255,255,255,0.08);
  border-radius: 9999px;
}
.dose-connector-fill {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  background: rgba(216,231,60,0.40);
  border-radius: 9999px;
}

.med-next-note {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 12px;
  color: rgba(255,255,255,0.40);
  text-align: center;
  margin-top: 10px;
  line-height: 1.4;
}
.med-next-note strong { color: rgba(255,255,255,0.65); font-weight: 700; }

/* ── Care team cards ── */
.team-card {
  background: var(--c-white);
  border-radius: 24px;
  border: 1px solid var(--c-dg-08);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.team-card + .team-card { margin-top: 10px; }

.team-avatar {
  width: 50px;
  height: 50px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
}
.team-info { flex: 1; min-width: 0; }
.team-name {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 15px;
  color: var(--c-dark-green);
  letter-spacing: -0.005em;
  margin-bottom: 2px;
}
.team-role {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 12px;
  color: var(--c-dg-60);
  margin-bottom: 6px;
}
.team-detail {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 12px;
  color: var(--c-dg-60);
}
.team-detail-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

.team-action {
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 9999px;
  padding: 8px 16px;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  text-decoration: none;
  flex-shrink: 0;
  border: none;
}
.team-action.outline {
  background: var(--c-natural);
  color: var(--c-dark-green);
  border: 1.5px solid var(--c-dg-16);
}
.team-action.primary {
  background: var(--c-dark-green);
  color: var(--c-white);
}
.team-action.plum-action {
  background: rgba(199,185,255,0.15);
  color: var(--c-dark-green);
  border: 1.5px solid rgba(199,185,255,0.35);
}

/* ── Next injection reminder ── */
.injection-card {
  background: var(--c-white);
  border-radius: 24px;
  border: 1px solid var(--c-dg-08);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.injection-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: rgba(151,221,247,0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.injection-icon svg { width: 22px; height: 22px; }
.injection-info { flex: 1; }
.injection-title {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 15px;
  color: var(--c-dark-green);
  margin-bottom: 2px;
}
.injection-detail {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 13px;
  color: var(--c-dg-60);
  line-height: 1.3;
}
.injection-badge {
  background: rgba(151,221,247,0.20);
  border: 1px solid rgba(151,221,247,0.40);
  border-radius: 9999px;
  padding: 5px 12px;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 12px;
  color: var(--c-dark-green);
  flex-shrink: 0;
}

/* Bottom Nav */
.bottom-nav {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 80px;
  background: var(--c-dark-green);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 8px 12px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; padding-top: 8px; cursor: pointer; opacity: 0.45; transition: opacity 140ms; text-decoration: none; }
.nav-item.active { opacity: 1; }
.nav-item:hover { opacity: 0.75; }
.nav-item.active:hover { opacity: 1; }
.nav-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; position: relative; }
.nav-dot { position: absolute; bottom: -3px; width: 5px; height: 5px; border-radius: 50%; background: var(--c-lime); }
.nav-label { font-family: var(--font-sans); font-weight: 500; font-size: 10px; letter-spacing: 0.02em; color: var(--c-white); }
</style>
</head>
<body>
