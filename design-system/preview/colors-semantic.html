<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 28px;background:#fff;font-family:"Circular Std",sans-serif;color:#142E0F}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .sw{width:200px;height:90px;border-radius:8px;display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:#142E0F;font-size:11px}
  .sw .nm{font-weight:700;font-size:13px}
  .sw .hex{opacity:.6;font-family:"Source Code Pro",monospace;font-size:10px;text-transform:uppercase}
  .pill{align-self:flex-start;background:rgba(255,255,255,.6);border-radius:99px;padding:3px 9px;font-weight:700;font-size:11px}
  .on-dark{color:#fff}
  .on-dark .pill{background:rgba(255,255,255,.18);color:#fff}
  .on-dark .hex{color:rgba(255,255,255,.7)}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#34CE00;color:#fff"><span class="pill">success</span><div><div class="nm">success</div><div class="hex">#34CE00</div></div></div>
  <div class="sw" style="background:#FFAC05"><span class="pill">warning</span><div><div class="nm">warning</div><div class="hex">#FFAC05</div></div></div>
  <div class="sw on-dark" style="background:#A60000"><span class="pill">error</span><div><div class="nm">error</div><div class="hex">#A60000</div></div></div>
  <div class="sw on-dark" style="background:#367ADD"><span class="pill">info</span><div><div class="nm">info</div><div class="hex">#367ADD</div></div></div>
  <div class="sw on-dark" style="background:#FB6E28"><span class="pill">HR high</span><div><div class="nm">hr-high</div><div class="hex">#FB6E28</div></div></div>
  <div class="sw" style="background:#4DCAAC;color:#fff"><span class="pill">target</span><div><div class="nm">target</div><div class="hex">#4DCAAC</div></div></div>
</div>
</body></html>
