<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../fontawesome.css">
<script src="../fa-icons.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<style>body{margin:0;padding:18px;background:#F4F0EB;font-family:"Circular Std",sans-serif;color:#142E0F}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:12px;overflow:hidden;background:#0F1F0C;border:2px solid transparent}
.tile.flag{border-color:#A60000}
.vid{aspect-ratio:16/10;position:relative;display:flex;align-items:center;justify-content:center}
.av{width:42px;height:42px;border-radius:99px;background:rgba(0,0,0,.35);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.name{position:absolute;left:8px;bottom:6px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.chip{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;padding:2px 6px;border-radius:99px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.strip{background:#1A2D16;color:#fff;padding:5px 8px;display:flex;gap:10px;align-items:center;font-size:11px;font-weight:900}
</style></head><body><div id="root"></div>
<script>
const {Icon}=window;
const P=[
  {n:"Susan A.",bg:"linear-gradient(135deg,#FB6E28,#C7B9FF)",hr:112,sp:96,st:"#34CE00",stl:"In range"},
  {n:"Ramón V.",bg:"linear-gradient(135deg,#A60000,#FB6E28)",hr:128,sp:91,st:"#A60000",stl:"Flagged",flag:true},
  {n:"Derek P.",bg:"linear-gradient(135deg,#D8E73C,#4DCAAC)",hr:86,sp:98,st:"#FFAC05",stl:"Below zone"},
];
const tile=p=>React.createElement("div",{className:"tile"+(p.flag?" flag":""),key:p.n},
  React.createElement("div",{className:"vid",style:{background:p.bg}},
    React.createElement("div",{className:"av"},p.n.split(" ").map(x=>x[0]).join("")),
    React.createElement("span",{className:"chip"},React.createElement("span",{style:{width:5,height:5,borderRadius:99,background:p.st}}),p.stl),
    React.createElement("span",{className:"name"},p.n)),
  React.createElement("div",{className:"strip"},
    React.createElement(Icon,{name:"heart-pulse",size:10,color:p.flag?"#FB6E28":"#D8E73C"}),React.createElement("span",{style:{color:p.flag?"#FB6E28":"#D8E73C"}},p.hr),
    React.createElement("span",{style:{opacity:.5,fontSize:9,fontWeight:400}},"bpm"),
    React.createElement(Icon,{name:"lungs",size:10,color:"#97DDF7"}),React.createElement("span",{style:{color:"#97DDF7"}},p.sp),
    React.createElement("span",{style:{opacity:.5,fontSize:9,fontWeight:400}},"%")));
ReactDOM.createRoot(document.getElementById("root")).render(
  React.createElement("div",{className:"grid"},P.map(tile)));
</script></body></html>
