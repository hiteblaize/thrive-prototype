<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:36px;background:#fff;display:flex;align-items:center;justify-content:center;gap:36px;flex-wrap:wrap;font-family:"Circular Std",sans-serif;color:#142E0F}
  .lockup{display:flex;align-items:center;gap:16px}
  .lockup img{height:54px;width:auto}
  .word{font-family:"ABC Marist",serif;font-weight:600;font-size:48px;letter-spacing:-.015em;line-height:1}
  .meta{display:flex;flex-direction:column;align-items:center;gap:10px}
  .lbl{font:500 11px/1 "Source Code Pro",monospace;color:rgba(20,46,15,.45);text-transform:uppercase;letter-spacing:.06em}
  .symbol{height:64px;width:auto}
  .on-dark{background:#142E0F;padding:20px;border-radius:12px}
  .on-dark .word{color:#fff}
</style></head>
<body>
<div class="meta"><div class="lockup"><img src="../assets/carda-symbol.svg" class="symbol"><span class="word">carda&nbsp;health</span></div><span class="lbl">primary lockup</span></div>
<div class="meta"><div class="lockup on-dark"><img src="../assets/carda-symbol.svg" class="symbol"><span class="word">carda&nbsp;health</span></div><span class="lbl">on dark green</span></div>
</body></html>
