<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:30px;background:#F4F0EB;color:#142E0F;font-family:"Circular Std",sans-serif;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .demo{display:flex;flex-direction:column;align-items:center;gap:10px}
  .sq{width:130px;height:90px;background:#fff;border-radius:12px}
  .s1{box-shadow:0 2px 6px rgba(0,0,0,.07)}
  .s2{box-shadow:0 4px 8px rgba(0,0,0,.12)}
  .s3{box-shadow:0 12px 32px rgba(0,0,0,.19)}
  .lbl{font:500 11px/1 "Source Code Pro",monospace;color:rgba(20,46,15,.55);text-transform:uppercase;letter-spacing:.06em}
  .meta{font-size:11px;opacity:.6;text-align:center;max-width:130px;line-height:1.4}
</style></head>
<body>
<div class="demo"><div class="sq s1"></div><div class="lbl">soft</div><div class="meta">0 · 2 · 6 / 7%</div></div>
<div class="demo"><div class="sq s2"></div><div class="lbl">card</div><div class="meta">0 · 4 · 8 / 12%<br>default elevation</div></div>
<div class="demo"><div class="sq s3"></div><div class="lbl">pop</div><div class="meta">0 · 12 · 32 / 19%<br>modals only</div></div>
</body></html>
