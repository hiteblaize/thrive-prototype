<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 28px;background:#fff}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .sw{width:130px;height:90px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#142E0F;font-family:"Circular Std",sans-serif;font-size:11px;line-height:1.3;letter-spacing:.005em}
  .sw .nm{font-weight:700;font-size:13px}
  .sw .hex{opacity:.6;font-family:"Source Code Pro",monospace;font-size:10px;text-transform:uppercase}
  .on-dark{color:#fff}
  .on-dark .hex{color:rgba(255,255,255,.7)}
  .bd{border:1px solid rgba(20,46,15,.08)}
</style></head>
<body>
<div class="row">
  <div class="sw on-dark" style="background:#142E0F"><div class="nm">dark green</div><div class="hex">#142E0F</div></div>
  <div class="sw" style="background:#D8E73C"><div class="nm">lime</div><div class="hex">#D8E73C</div></div>
  <div class="sw on-dark" style="background:#FB6E28"><div class="nm">citrus</div><div class="hex">#FB6E28</div></div>
  <div class="sw" style="background:#C7B9FF"><div class="nm">plum</div><div class="hex">#C7B9FF</div></div>
  <div class="sw" style="background:#97DDF7"><div class="nm">sky</div><div class="hex">#97DDF7</div></div>
  <div class="sw bd" style="background:#F4F0EB"><div class="nm">natural</div><div class="hex">#F4F0EB</div></div>
</div>
</body></html>
