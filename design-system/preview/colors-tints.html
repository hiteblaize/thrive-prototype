<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 28px;background:#fff;font-family:"Circular Std",sans-serif;color:#142E0F}
  .row{display:flex;gap:0;flex-wrap:wrap;border:1px solid rgba(20,46,15,.08);border-radius:8px;overflow:hidden}
  .sw{flex:1;min-width:90px;height:80px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-size:11px;color:#142E0F}
  .sw .nm{font-weight:700}
  .sw .hex{opacity:.6;font-family:"Source Code Pro",monospace;font-size:10px;text-transform:uppercase}
  .on-dark{color:#fff}
  .on-dark .hex{color:rgba(255,255,255,.7)}
  h4{font:700 12px/1 "Circular Std",sans-serif;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;opacity:.55}
</style></head>
<body>
<h4>dark green — alpha tints</h4>
<div class="row">
  <div class="sw" style="background:rgba(20,46,15,0.04)"><div class="nm">dg/4</div><div class="hex">04% α</div></div>
  <div class="sw" style="background:rgba(20,46,15,0.08)"><div class="nm">dg/8</div><div class="hex">08% α</div></div>
  <div class="sw" style="background:rgba(20,46,15,0.16)"><div class="nm">dg/16</div><div class="hex">16% α</div></div>
  <div class="sw" style="background:rgba(20,46,15,0.30)"><div class="nm">dg/30</div><div class="hex">30% α</div></div>
  <div class="sw on-dark" style="background:rgba(20,46,15,0.60)"><div class="nm">dg/60</div><div class="hex">60% α</div></div>
  <div class="sw on-dark" style="background:rgba(20,46,15,0.85)"><div class="nm">dg/85</div><div class="hex">85% α</div></div>
  <div class="sw on-dark" style="background:#142E0F"><div class="nm">dg/100</div><div class="hex">#142E0F</div></div>
</div>
</body></html>
