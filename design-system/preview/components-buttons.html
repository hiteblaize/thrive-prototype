<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;color:#142E0F;font-family:"Circular Std",sans-serif;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .grp{display:flex;align-items:center;gap:14px}
  .lbl{font:500 11px/1 "Source Code Pro",monospace;color:rgba(20,46,15,.45);text-transform:uppercase;letter-spacing:.06em}
  .b{display:inline-flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.02em;font-family:"Circular Std",sans-serif;color:#142E0F;border-radius:9999px;padding:0 28px;border:1px solid rgba(20,46,15,.08);cursor:pointer;transition:box-shadow .14s,border-color .14s,transform .1s}
  .b.lime{background:#D8E73C}
  .b.dark{background:#142E0F;color:#fff}
  .b.white{background:#fff}
  .b:hover{box-shadow:0 4px 8px rgba(0,0,0,.12);border-color:#142E0F}
  .b:active{transform:scale(.96);box-shadow:none}
  .b.lg{height:64px;font-size:16px}
  .b.xl{height:80px;font-size:21px}
</style></head>
<body>
<div class="grp"><span class="lbl">large/64</span>
<button class="b lime lg">Get Started</button>
<button class="b dark lg">How it works</button>
<button class="b white lg">Learn more</button>
</div>
<div class="grp"><span class="lbl">xlarge/80</span>
<button class="b lime xl">Finish My Assessment</button>
<button class="b dark xl">Submit</button>
</div>
</body></html>
