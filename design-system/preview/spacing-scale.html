<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px 26px;background:#fff;color:#142E0F;font-family:"Circular Std",sans-serif}
  .row{display:flex;gap:24px;align-items:center;margin-bottom:18px}
  .lbl{font:500 11px/1 "Source Code Pro",monospace;color:rgba(20,46,15,.45);width:90px;text-transform:uppercase;letter-spacing:.06em}
  .box{background:#142E0F;border-radius:6px}
</style></head>
<body>
<div class="row"><span class="lbl">sp-1 / 4</span>  <div class="box" style="width:4px;height:20px"></div><span style="font-size:12px;opacity:.6">--sp-1</span></div>
<div class="row"><span class="lbl">sp-2 / 8</span>  <div class="box" style="width:8px;height:20px"></div><span style="font-size:12px;opacity:.6">--sp-2</span></div>
<div class="row"><span class="lbl">sp-4 / 16</span> <div class="box" style="width:16px;height:20px"></div><span style="font-size:12px;opacity:.6">--sp-4 · default gap</span></div>
<div class="row"><span class="lbl">sp-6 / 24</span> <div class="box" style="width:24px;height:20px"></div><span style="font-size:12px;opacity:.6">--sp-6 · card padding</span></div>
<div class="row"><span class="lbl">sp-8 / 32</span> <div class="box" style="width:32px;height:20px"></div><span style="font-size:12px;opacity:.6">--sp-8 · large card padding</span></div>
<div class="row"><span class="lbl">sp-14 / 56</span><div class="box" style="width:56px;height:20px"></div><span style="font-size:12px;opacity:.6">--sp-14 · pop modal padding</span></div>
</body></html>
