<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;color:#142E0F;font-family:"Circular Std",sans-serif}
  .stack{display:flex;flex-direction:column;gap:18px}
  .row{display:flex;align-items:center;gap:24px}
  .lbl{font:500 11px/1 "Source Code Pro",monospace;color:rgba(20,46,15,.45);width:120px;text-transform:uppercase;letter-spacing:.06em}
  .specimen{font-family:"ABC Marist",serif;font-weight:600;color:#142E0F}
  .specimen.alt{font-family:"Circular Std",sans-serif;font-weight:900}
  .meta{font:500 11px/1.4 "Source Code Pro",monospace;color:rgba(20,46,15,.55);margin-left:auto;text-align:right}
</style></head>
<body>
<div class="stack">
  <div class="row">
    <span class="lbl">Display</span>
    <span class="specimen" style="font-size:56px;line-height:1;letter-spacing:-.02em">ABC Marist SemiBold</span>
    <span class="meta">Aa &nbsp; 1234567890<br>marketing · slides · hero</span>
  </div>
  <div class="row">
    <span class="lbl">Body / UI</span>
    <span class="specimen alt" style="font-size:40px;line-height:1;letter-spacing:-.01em">Circular Std</span>
    <span class="meta">Book · Medium · Bold · Black<br>app · web · everything else</span>
  </div>
  <div class="row">
    <span class="lbl">Mono</span>
    <span style="font-family:'Source Code Pro',monospace;font-weight:500;font-size:24px">Source Code Pro</span>
    <span class="meta">12px only<br>designer notes / dev specs</span>
  </div>
</div>
</body></html>
